name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Validate this release tag; the caller builds its images
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  image:
    # Release publishing builds and tests the same image after these checks.
    if: github.event_name != 'release' && inputs.release-tag == ''
    uses: ./.github/workflows/image.yml

  rust:
    name: Rust checks and generated CRD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      - name: Verify Rust and generated CRD
        run: ./scripts/verify.sh rust

  helm:
    name: Helm chart validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Verify Helm chart
        run: ./scripts/verify.sh helm
