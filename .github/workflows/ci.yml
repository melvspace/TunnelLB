name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust checks and generated CRD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Check generated CRD consistency
        run: |
          mkdir -p /tmp/codex
          cargo run --locked -- crd > /tmp/codex/machines.yaml
          diff -u charts/tunnellb/crds/machines.yaml /tmp/codex/machines.yaml

  helm:
    name: Helm chart validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # The API server CIDR is an offline validation fixture only.
      - name: Lint Helm chart
        run: |
          helm lint charts/tunnellb --strict \
            --namespace tunnellb-system \
            --set 'networkPolicy.apiServerCIDRs[0]=192.0.2.1/32'

      - name: Render Helm chart
        run: |
          helm template tunnellb charts/tunnellb --include-crds \
            --namespace tunnellb-system \
            --set 'networkPolicy.apiServerCIDRs[0]=192.0.2.1/32' > /dev/null
