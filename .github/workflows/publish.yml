name: Publish release
run-name: Publish ${{ inputs.release-tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to rebuild (vX.Y.Z or chart-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release-tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(inputs.release-tag || github.event.release.tag_name, 'v') || startsWith(inputs.release-tag || github.event.release.tag_name, 'chart-v')
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}

  image:
    if: startsWith(inputs.release-tag || github.event.release.tag_name, 'v')
    needs: checks
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}

  chart:
    if: startsWith(inputs.release-tag || github.event.release.tag_name, 'chart-v')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release-tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Verify release tag matches the chart version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          chart_version="$(helm show chart charts/tunnellb | awk '$1 == "version:" { print $2 }')"

          if [[ "$RELEASE_TAG" != "chart-v$chart_version" ]]; then
            echo "Release tag must be chart-v<Chart.yaml version>" >&2
            exit 1
          fi

      - name: Package chart
        run: helm package charts/tunnellb --destination "$RUNNER_TEMP/charts"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push release chart
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          helm push "$RUNNER_TEMP/charts/tunnellb-${RELEASE_TAG#chart-v}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      - name: Log out of GitHub Container Registry
        if: always()
        run: helm registry logout ghcr.io
