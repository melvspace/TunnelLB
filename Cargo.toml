[package]
name = "tunnellb"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes LoadBalancer services through isolated outbound tunnels"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
k8s-openapi = { version = "0.28", features = ["v1_35", "schemars"] }
kube = { version = "4.2", features = ["runtime", "derive", "rustls-tls"] }
libc = "0.2"
rand = "0.9"
rcgen = "0.14"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
