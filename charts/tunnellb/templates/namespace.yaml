{{- if or (eq .Release.Namespace "default") (hasPrefix "kube-" .Release.Namespace) -}}
{{- fail "TunnelLB requires a dedicated operator namespace; use --namespace tunnellb-system" -}}
{{- end -}}
{{- if .Values.createNamespace -}}
{{- $existing := lookup "v1" "Namespace" "" .Release.Namespace -}}
{{- if $existing -}}
{{- $annotations := default dict $existing.metadata.annotations -}}
{{- $labels := default dict $existing.metadata.labels -}}
{{- if or (ne (index $annotations "meta.helm.sh/release-name") .Release.Name) (ne (index $annotations "meta.helm.sh/release-namespace") .Release.Namespace) (ne (index $labels "app.kubernetes.io/managed-by") "Helm") -}}
{{- fail "The namespace already exists and is not owned by this release. Set createNamespace=false and configure its worker NET_ADMIN admission policy explicitly; TunnelLB will not lower an existing namespace policy." -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "tunnellb.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    helm.sh/resource-policy: keep
    tunnellb.io/namespace-purpose: "Dedicated controller, SSH jobs and connectors; do not run application workloads here."
    tunnellb.io/pod-security-reason: "Worker init containers need NET_ADMIN only in their own pod network namespace to install egress guards. Main processes have no capabilities and never use host networking."
{{- end }}
