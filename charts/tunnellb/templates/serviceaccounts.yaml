apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnellb-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnellb.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnellb-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnellb.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
