apiVersion: v1
kind: Service
metadata:
  name: game
  namespace: tunnellb-demo
  annotations:
    tunnellb.io/pool: public
spec:
  type: LoadBalancer
  loadBalancerClass: tunnellb.io/edge
  allocateLoadBalancerNodePorts: false
  # Match real, ready application Pods serving UDP on port 7777.
  selector:
    app: game
  ports:
    - name: game
      protocol: UDP
      port: 7777
      targetPort: 7777
